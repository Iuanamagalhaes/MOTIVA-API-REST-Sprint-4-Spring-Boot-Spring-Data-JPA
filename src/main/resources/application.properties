spring.application.name=motiva-api

# ---------- Oracle FIAP (credenciais via variaveis de ambiente; NUNCA hardcode) ----------
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USER:SEU_RM}
spring.datasource.password=${DB_PASSWORD:SUA_SENHA}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Opcional: arquivo local (ignorado pelo Git) para guardar usuario/senha
spring.config.import=optional:file:./application-local.properties

# ---------- JPA / Hibernate ----------
# As tabelas ja existem (Sprint 3): o Hibernate NAO cria nem altera nada.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Mostra o SQL gerado pelo Spring Data (veja a resposta da pergunta 4 no README)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
